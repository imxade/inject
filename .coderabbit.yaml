language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
  tools:
    biome:
      enabled: true
  path_instructions:
    - path: "src/**"
      instructions: |
        Review this as an unopinionated native input systems layer.
        The library may expose native APIs, structures, constants, device creation,
        raw event submission, and lifecycle management. It must not add application
        semantics such as key-name maps, text/combo conversion, gestures, sensitivity,
        scroll policy, controller layouts, or protocol-level input handling.
        Flag eager loading of platform libraries on unsupported operating systems.
        Check native resource lifecycle, cleanup, FFI error handling, and API stability.
    - path: ".github/workflows/**"
      instructions: |
        Review workflow permissions, untrusted pull-request execution, action versions,
        dependency-install behavior, and whether bot-generated pull requests can pass CI.
