name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected format: type(scope): description"
            exit 1
          fi

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Biome check
        run: npm run check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build


  package-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pack package
        run: npm pack --dry-run

      - name: Verify packed consumer install
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          mkdir -p /tmp/inject-consumer
          cd /tmp/inject-consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$tarball" --no-audit --no-fund
          node --input-type=module -e "const m = await import('@imxade/inject'); if (typeof m.loadNativeBackend !== 'function') process.exit(1)"

      - name: Verify GitHub consumer install
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p /tmp/inject-git-consumer
          cd /tmp/inject-git-consumer
          npm init -y >/dev/null
          npm install "github:imxade/inject#${GITHUB_SHA}" --no-audit --no-fund
          node --input-type=module -e "const m = await import('@imxade/inject'); if (typeof m.loadNativeBackend !== 'function') process.exit(1)"
