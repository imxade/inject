name: Native E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-uinput:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable uinput and evdev access
        shell: bash
        run: |
          sudo modprobe uinput
          echo 'KERNEL=="uinput", MODE="0666"' | sudo tee /etc/udev/rules.d/99-inject-e2e.rules
          echo 'SUBSYSTEM=="input", KERNEL=="event*", MODE="0666"' | sudo tee -a /etc/udev/rules.d/99-inject-e2e.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
          sudo chmod a+rw /dev/uinput

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Linux native E2E
        env:
          INJECT_NATIVE_E2E: "1"
        run: npm run test:e2e:linux

  macos-coregraphics:
    if: github.event_name != 'pull_request' && vars.NATIVE_E2E_ENABLED == 'true'
    runs-on: [self-hosted, macOS, inject-e2e]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run macOS native E2E
        env:
          INJECT_NATIVE_E2E: "1"
        run: npm run test:e2e:macos

  windows-sendinput:
    if: github.event_name != 'pull_request' && vars.NATIVE_E2E_ENABLED == 'true'
    runs-on: [self-hosted, Windows, inject-e2e]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Windows native E2E
        env:
          INJECT_NATIVE_E2E: "1"
        run: npm run test:e2e:windows
